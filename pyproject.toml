[project]
name = "binance-wave-rider"
version = "0.1.0"
description = "Telegram-only Binance spot paper trading experiment"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
